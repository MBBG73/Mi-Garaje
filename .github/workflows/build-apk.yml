name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/local-notifications @capacitor/filesystem @capacitor/share
          npm install -D @capacitor/cli
      - name: Generar proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Aplicar iconos y pantalla de inicio
        run: |
          cp -r android-res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp assets/splash-android.png {} \;
          echo "Iconos aplicados:"
          ls android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mi-garaje-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
